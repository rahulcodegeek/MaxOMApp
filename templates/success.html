<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        /* Reset some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff; /* White box background */
            padding: 40px; /* Add padding to the outer box */
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .circle {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #4CAF50; /* Green circle background */
            width: 100px;
            height: 100px;
            border-radius: 50%;
            font-size: 36px;
            color: #fff; /* White text */
            margin: 0 auto;
        }

        .success {
            color: #4CAF50; /* Green text */
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        p {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Your Order Has Been Placed Successful</p>
        <br>
        <div class="circle">&#10004;</div>
        <div class="success">Success</div>
        <p>Thank You For Your Payment! We Appreciate Your Business.</p>
    </div>
</body>
</html>
